apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name:  todo
  namespace:  todo
spec:
  ingressClassName: nginx
  rules:
  - host: todo.local
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: todo-web
            port:
              number: 80
