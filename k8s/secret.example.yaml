# Template. Copy to k8s/secret.yaml and replace the placeholder values.
# k8s/secret.yaml is git-ignored and must NOT be committed.
apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: todo
type: Opaque
stringData:
  # Long random string, e.g.: py -c "import secrets; print(secrets.token_urlsafe(50))"
  DJANGO_SECRET_KEY: <DjangoSecretKey>
  POSTGRES_PASSWORD: <PostgresPassword>
  POSTGRES_USER: <PostgresUser>
  POSTGRES_DB: <PostgresDB>
